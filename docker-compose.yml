services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chiefvoice
      POSTGRES_USER: chiefvoice
      POSTGRES_PASSWORD: local-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chiefvoice -d chiefvoice"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: chiefvoice-local
      MINIO_ROOT_PASSWORD: chiefvoice-local-storage-password
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: chiefvoice-api
    pull_policy: never
    depends_on:
      - minio
    command:
      - python
      - -c
      - |
        import time
        import boto3
        from botocore.exceptions import ClientError, EndpointConnectionError
        client = boto3.client(
            "s3",
            endpoint_url="http://minio:9000",
            region_name="us-east-1",
            aws_access_key_id="chiefvoice-local",
            aws_secret_access_key="chiefvoice-local-storage-password",
        )
        for attempt in range(60):
            try:
                client.head_bucket(Bucket="chiefvoice-recordings")
                break
            except EndpointConnectionError:
                time.sleep(2)
            except ClientError as error:
                code = error.response.get("Error", {}).get("Code")
                if code in {"404", "NoSuchBucket", "NotFound"}:
                    client.create_bucket(Bucket="chiefvoice-recordings")
                    break
                raise
        else:
            raise RuntimeError("MinIO did not become available")
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file: .env.docker
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.docker
    environment:
      DATABASE_URL: postgresql+asyncpg://chiefvoice:local-only-password@db:5432/chiefvoice
      OIDC_ISSUER: http://localhost:9000
      OIDC_AUDIENCE: chiefvoice-local
      OIDC_JWKS_URL: http://dev-oidc:9000/jwks
      PLATFORM_ADMIN_SUBJECTS: local-dev-user
      OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: chiefvoice-recordings
      OBJECT_STORAGE_ACCESS_KEY_ID: chiefvoice-local
      OBJECT_STORAGE_SECRET_ACCESS_KEY: chiefvoice-local-storage-password
      OBJECT_STORAGE_ADDRESSING_STYLE: path
      OBJECT_STORAGE_PREFIX: chiefvoice
      RECORDINGS_ENABLED: "true"
      RECORDINGS_STORAGE_BACKEND: s3
      RECORDINGS_ENCRYPTION_KEY: SMHLVOFrsltR9rWOLAshguCgf3UwTCwSSUF3MysKG0o=
    ports:
      - "8000:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      dev-oidc:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12

  dev-oidc:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "/app/scripts/dev_oidc.py"]
    volumes:
      - ./scripts/dev_oidc.py:/app/scripts/dev_oidc.py:ro
    environment:
      DEV_OIDC_PORT: "9000"
      DEV_OIDC_ISSUER: http://localhost:9000
    ports:
      - "9000:9000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
      VITE_OIDC_AUTHORITY: http://localhost:9000
      VITE_OIDC_CLIENT_ID: chiefvoice-console
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
