services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chiefvoice
      POSTGRES_USER: chiefvoice
      POSTGRES_PASSWORD: local-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chiefvoice -d chiefvoice"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file: .env.docker
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.docker
    environment:
      DATABASE_URL: postgresql+asyncpg://chiefvoice:local-only-password@db:5432/chiefvoice
      OIDC_ISSUER: http://dev-oidc:9000
      OIDC_AUDIENCE: chiefvoice-local
      OIDC_JWKS_URL: http://dev-oidc:9000/jwks
      PLATFORM_ADMIN_SUBJECTS: local-dev-user
    ports:
      - "8000:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      dev-oidc:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12

  dev-oidc:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "/app/scripts/dev_oidc.py"]
    environment:
      DEV_OIDC_PORT: "9000"
    ports:
      - "9000:9000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
