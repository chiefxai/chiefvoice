name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chiefvoice
          POSTGRES_PASSWORD: chiefvoice
          POSTGRES_DB: chiefvoice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chiefvoice -d chiefvoice"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://chiefvoice:chiefvoice@localhost:5432/chiefvoice
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and development tools
        run: uv sync --extra dev
      - name: Apply all database migrations to PostgreSQL
        run: uv run alembic upgrade head
      - name: Run tests
        run: uv run pytest -q
      - name: Check imports and bytecode compilation
        run: |
          uv run ruff check src tests --select F
          uv run mypy src/chiefvoice_sdk src/chiefvoice/agents/post_call/gcp_function_dispatch.py src/chiefvoice/agents/post_call/lambda_handler.py
          uv run python -m compileall -q src

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
