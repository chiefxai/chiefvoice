name: Deploy to GCP

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "**.text"
      - "infra/**"
      - "cloudbuild.yaml"
      - ".github/workflows/terraform-gcp-region.yml"
      - ".github/workflows/deploy-gcp.yml"
  workflow_dispatch:

concurrency:
  group: chiefvoice-gcp-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy production GCP stack
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_GITHUB_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_GITHUB_DEPLOY_SERVICE_ACCOUNT }}
      GCP_CLOUD_BUILD_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_BUILD_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_CLOUDBUILD_SUBSTITUTIONS_JSON: ${{ vars.GCP_CLOUDBUILD_SUBSTITUTIONS_JSON }}
    steps:
      - name: Check out production revision
        uses: actions/checkout@v7

      - name: Validate deployment settings
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GCP_GITHUB_DEPLOY_SERVICE_ACCOUNT GCP_CLOUD_BUILD_SERVICE_ACCOUNT GCP_WORKLOAD_IDENTITY_PROVIDER; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub repository variable: ${name}" >&2
              exit 1
            fi
          done
          [[ "$GCP_REGION" =~ ^[a-z]+-[a-z0-9]+[0-9]$ ]] || { echo "GCP_REGION must be a valid region, such as us-central1" >&2; exit 1; }
          [[ "$GCP_GITHUB_DEPLOY_SERVICE_ACCOUNT" == *@*.iam.gserviceaccount.com ]] || { echo "GCP_GITHUB_DEPLOY_SERVICE_ACCOUNT must be a service account email" >&2; exit 1; }
          [[ "$GCP_CLOUD_BUILD_SERVICE_ACCOUNT" == *@*.iam.gserviceaccount.com ]] || { echo "GCP_CLOUD_BUILD_SERVICE_ACCOUNT must be a service account email" >&2; exit 1; }
          [[ "$GCP_PROJECT_ID" == "chiefvoice-service" ]] || { echo "GCP_PROJECT_ID must be chiefvoice-service for production deployment" >&2; exit 1; }
          [[ "$GCP_GITHUB_DEPLOY_SERVICE_ACCOUNT" == "chiefvoice-github-deploy@${GCP_PROJECT_ID}.iam.gserviceaccount.com" ]] || { echo "GCP_GITHUB_DEPLOY_SERVICE_ACCOUNT must be the dedicated app deployment identity" >&2; exit 1; }

      - name: Prepare Terraform-managed Cloud Build substitutions
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          import re
          import sys

          raw = os.environ.get("GCP_CLOUDBUILD_SUBSTITUTIONS_JSON", "")
          if not raw:
              sys.exit("Missing GitHub repository variable: GCP_CLOUDBUILD_SUBSTITUTIONS_JSON")
          values = json.loads(raw)
          if not isinstance(values, dict) or not values:
              sys.exit("GCP_CLOUDBUILD_SUBSTITUTIONS_JSON must contain a non-empty object")

          parts = []
          for key, value in sorted(values.items()):
              if not isinstance(key, str) or not re.fullmatch(r"_[A-Z0-9_]+", key):
                  sys.exit(f"Invalid Cloud Build substitution key: {key!r}")
              value = str(value)
              if not value.strip():
                  sys.exit(f"Cloud Build substitution {key} is empty")
              if "\n" in value or "\r" in value:
                  sys.exit(f"Cloud Build substitution {key} contains a newline")
              parts.append(f"{key}={value}")
          delimiter = "__CHIEFVOICE_SUBSTITUTION_DELIMITER__"
          while any(delimiter in part for part in parts):
              delimiter += "_"
          print("CLOUDBUILD_SUBSTITUTIONS=^" + delimiter + "^" + delimiter.join(parts))
          PY

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_GITHUB_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Submit production deployment to Cloud Build
        shell: bash
        run: |
          set -Eeuo pipefail
          build_service_account="projects/${GCP_PROJECT_ID}/serviceAccounts/${GCP_CLOUD_BUILD_SERVICE_ACCOUNT}"
          diagnostics_file="$(mktemp)"
          set +e
          gcloud builds submit \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --config=cloudbuild.yaml \
            --substitutions="$CLOUDBUILD_SUBSTITUTIONS" \
            --service-account="$build_service_account" \
            --log-http \
            --verbosity=debug \
            --quiet \
            . 2>"$diagnostics_file"
          submit_status=$?
          set -e

          if [[ "$submit_status" -ne 0 ]]; then
            python - "$diagnostics_file" <<'PY'
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8", errors="replace") as diagnostic_file:
              lines = diagnostic_file.read().splitlines()

          relevant = re.compile(
              r"403|error|forbidden|permission|serviceusage|storage\.buckets|billing|organization",
              re.IGNORECASE,
          )
          sensitive = re.compile(r"authorization|bearer|send:", re.IGNORECASE)
          for line in lines:
              if relevant.search(line) and not sensitive.search(line):
                  line = re.sub(
                      r"(?i)(access_token[\"'=:\s]+)[^,\s\"']+",
                      r"\1[REDACTED]",
                      line,
                  )
                  print(line[:2000])
          PY
          fi

          rm -f "$diagnostics_file"
          exit "$submit_status"
