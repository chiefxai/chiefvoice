[project]
name = "chiefvoice"
version = "0.1.0"
description = "Provider-neutral real-time voice agent built with Pipecat"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pipecat-ai[webrtc,websocket,google]>=1.8.1,<1.9",
  "pipecat-vobiz>=0.0.3,<0.1",
  "langchain-core>=1.0,<2",
  "langchain-google-genai>=4.0,<5",
  "PyJWT[crypto]>=2.10",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.20",
  "python-dotenv>=1.0",
  "SQLAlchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "cryptography>=44.0",
  "boto3>=1.35,<2",
  "prometheus-client>=0.21",
  "opentelemetry-api>=1.29",
  "opentelemetry-sdk>=1.29",
  "opentelemetry-exporter-otlp-proto-http>=1.29",
]

[project.optional-dependencies]
dev = ["ruff>=0.9", "mypy>=1.14", "pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chiefvoice"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
