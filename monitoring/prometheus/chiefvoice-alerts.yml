groups:
  - name: chiefvoice-availability
    rules:
      - alert: ChiefvoiceHighHttp5xxRate
        expr: |
          (
            sum(rate(chiefvoice_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(chiefvoice_http_requests_total[5m])), 0.001)
          ) > 0.05
          and sum(rate(chiefvoice_http_requests_total[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
          service: chiefvoice
        annotations:
          summary: Chiefvoice HTTP error rate is elevated
          description: More than 5% of HTTP requests have returned 5xx responses for five minutes.

      - alert: ChiefvoiceOutboundCallStartsFailing
        expr: increase(chiefvoice_call_start_events_total{result=~"failed|unavailable"}[10m]) > 0
        for: 2m
        labels:
          severity: warning
          service: chiefvoice
        annotations:
          summary: Outbound call starts are failing
          description: At least one outbound call start failed or the call service was unavailable in the last ten minutes.

      - alert: ChiefvoicePostCallJobsExhausted
        expr: increase(chiefvoice_post_call_jobs_total{event="failed"}[10m]) > 0
        for: 2m
        labels:
          severity: warning
          service: chiefvoice
        annotations:
          summary: A post-call job exhausted its retries
          description: At least one post-call analysis job reached its terminal failed state in the last ten minutes.

      - alert: ChiefvoicePostCallLambdaDispatchFailing
        expr: increase(chiefvoice_post_call_jobs_total{event="dispatch_failed"}[10m]) > 0
        for: 2m
        labels:
          severity: critical
          service: chiefvoice
        annotations:
          summary: Post-call jobs cannot be dispatched to Lambda
          description: The API could not get Lambda to accept one or more durable post-call job events. Jobs remain in PostgreSQL and should retry; investigate IAM, throttling, or AWS connectivity.

      - alert: ChiefvoicePostCallQueueStalled
        expr: max(chiefvoice_post_call_queue_oldest_queued_age_seconds) > 300
        for: 5m
        labels:
          severity: warning
          service: chiefvoice
        annotations:
          summary: Post-call jobs are waiting too long to start
          description: The oldest queued analysis job has been waiting more than five minutes. Check API dispatcher health, Lambda permissions/throttling, and database connectivity.

      - alert: ChiefvoicePostCallWorkerIterationFailing
        expr: increase(chiefvoice_post_call_jobs_total{event=~"worker_iteration_failed|dispatcher_iteration_failed"}[10m]) > 0
        for: 2m
        labels:
          severity: critical
          service: chiefvoice
        annotations:
          summary: Post-call worker cannot poll or process its queue
          description: The worker loop is encountering persistent database or infrastructure errors. Inspect API logs and Postgres connectivity.

      - alert: ChiefvoicePostCallEnqueueFallbackFailed
        expr: increase(chiefvoice_post_call_enqueue_fallback_total{event=~"failed|unavailable|reconcile_failed|scan_failed"}[10m]) > 0
        for: 1m
        labels:
          severity: critical
          service: chiefvoice
        annotations:
          summary: A completed call could not be saved for post-call processing
          description: The primary Postgres enqueue failed and the durable fallback was unavailable or failed. Recover the call transcript from provider recording/session data if possible.

      - alert: ChiefvoicePostCallJobsPermanentlyFailed
        expr: max(chiefvoice_post_call_queue_jobs{status="failed"}) > 0
        for: 5m
        labels:
          severity: warning
          service: chiefvoice
        annotations:
          summary: Post-call jobs need review or replay
          description: One or more post-call jobs are in a terminal failed state. Inspect the call status and use the tenant-scoped replay workflow if appropriate.

      - alert: ChiefvoicePostCallWebhookDeliveriesExhausted
        expr: increase(chiefvoice_post_call_webhook_deliveries_total{event="failed"}[10m]) > 0
        for: 2m
        labels:
          severity: warning
          service: chiefvoice
        annotations:
          summary: A post-call webhook exhausted its retries
          description: At least one CRM webhook delivery reached its terminal failed state in the last ten minutes.

      - alert: ChiefvoiceProviderCallErrors
        expr: increase(chiefvoice_sessions_ended_total{reason="provider_error"}[10m]) > 0
        for: 2m
        labels:
          severity: warning
          service: chiefvoice
        annotations:
          summary: The telephony provider reported call errors
          description: Provider error terminations occurred in the last ten minutes.

      - alert: ChiefvoiceCallsReachingDurationCap
        expr: increase(chiefvoice_call_duration_limit_events_total[15m]) > 0
        for: 2m
        labels:
          severity: info
          service: chiefvoice
        annotations:
          summary: Calls are reaching configured duration caps
          description: At least one call hit its configured duration cap in the last fifteen minutes.

      - alert: ChiefvoiceBackupRunFailed
        expr: increase(chiefvoice_data_lifecycle_runs_total{task="backup",result="failed"}[2h]) > 0
        for: 2m
        labels:
          severity: critical
          service: chiefvoice
        annotations:
          summary: Chiefvoice database backup failed
          description: A scheduled backup or verification pass failed in the last two hours.

      - alert: ChiefvoiceRetentionRunFailed
        expr: increase(chiefvoice_data_lifecycle_runs_total{task="retention",result="failed"}[2h]) > 0
        for: 2m
        labels:
          severity: warning
          service: chiefvoice
        annotations:
          summary: Chiefvoice retention run failed
          description: A scheduled retention pass failed in the last two hours.

      - alert: ChiefvoiceRecordingStorageFailed
        expr: increase(chiefvoice_recording_storage_events_total{result="failed"}[10m]) > 0
        for: 2m
        labels:
          severity: warning
          service: chiefvoice
        annotations:
          summary: Call recording could not be saved to object storage
          description: At least one encrypted recording upload failed in the last ten minutes.
