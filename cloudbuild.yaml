substitutions:
  _REGION: us-central1
  _AR_REPOSITORY: chiefvoice
  _IMAGE_NAME: api
  _VM_NAME: chiefvoice-backend
  _ZONE: us-central1-a
  _PUBLIC_DOMAIN: voice.example.com
  _FUNCTION_NAME: chiefvoice-post-call
  _FUNCTION_VPC_CONNECTOR: chiefvoice-functions
  _FUNCTION_SERVICE_ACCOUNT: CHANGE_ME_FUNCTION_SA
  _TASK_INVOKER_SERVICE_ACCOUNT: CHANGE_ME_TASK_INVOKER_SA
  _BACKEND_SERVICE_ACCOUNT: CHANGE_ME_BACKEND_SA
  _POST_CALL_FUNCTION_MAX_INSTANCES: "10"
  _DATABASE_URL_SECRET: chiefvoice-function-database-url
  _POST_CALL_ENCRYPTION_KEY_SECRET: chiefvoice-post-call-encryption-key
  _GCP_PROJECT_PARENT: folders/CHANGE_ME
  _GCP_BILLING_ACCOUNT_ID: CHANGE_ME
  _GCP_BUDGET_API_PROJECT_ID: CHANGE_ME_BUDGET_API_PROJECT
  _GCP_VERTEX_MONTHLY_SPEND_CAP: "100"
  _VERTEX_LOCATION: us-central1
  _POST_CALL_MODEL: gemini-2.5-flash
  _OIDC_ISSUER: CHANGE_ME
  _OIDC_AUDIENCE: CHANGE_ME
  _OIDC_JWKS_URL: CHANGE_ME

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 3600s

steps:
  - id: verify-source
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        python -m pip install --no-cache-dir '.[dev]'
        pytest -q
        ruff check src tests --select F
        python -m compileall -q src

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}

  - id: deploy-post-call-function
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        bash deploy/gcp/post-call-function/prepare_source.sh /workspace/.post-call-function-source
        gcloud functions deploy ${_FUNCTION_NAME} \
          --gen2 --runtime=python312 --region=${_REGION} \
          --source=/workspace/.post-call-function-source --entry-point=handler \
          --trigger-http --no-allow-unauthenticated \
          --service-account=${_FUNCTION_SERVICE_ACCOUNT} \
          --vpc-connector=${_FUNCTION_VPC_CONNECTOR} \
          --egress-settings=private-ranges-only \
          --timeout=240s --memory=1Gi \
          --max-instances=${_POST_CALL_FUNCTION_MAX_INSTANCES} \
          --set-env-vars=POST_CALL_AGENT_PROVIDER=langchain_vertex,VERTEX_PROJECT_ISOLATION_ENABLED=true,VERTEX_LOCATION=${_VERTEX_LOCATION},POST_CALL_MODEL=${_POST_CALL_MODEL},GCP_PROJECT_PARENT=${_GCP_PROJECT_PARENT},GCP_BILLING_ACCOUNT_ID=${_GCP_BILLING_ACCOUNT_ID},GCP_RUNTIME_SERVICE_ACCOUNT=${_BACKEND_SERVICE_ACCOUNT},GCP_POST_CALL_SERVICE_ACCOUNT=${_FUNCTION_SERVICE_ACCOUNT},GCP_BUDGET_API_PROJECT_ID=${_GCP_BUDGET_API_PROJECT_ID},GCP_VERTEX_MONTHLY_SPEND_CAP=${_GCP_VERTEX_MONTHLY_SPEND_CAP} \
          --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest,POST_CALL_ENCRYPTION_KEY=${_POST_CALL_ENCRYPTION_KEY_SECRET}:latest \
          --quiet
        gcloud run services add-iam-policy-binding ${_FUNCTION_NAME} \
          --region=${_REGION} \
          --member=serviceAccount:${_TASK_INVOKER_SERVICE_ACCOUNT} \
          --role=roles/run.invoker --quiet
        gcloud functions describe ${_FUNCTION_NAME} --gen2 --region=${_REGION} \
          --format='value(serviceConfig.uri)' > /workspace/post-call-function-url

  - id: deploy-vm-and-migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}"
        function_url="$(cat /workspace/post-call-function-url)"
        test -n "$${function_url}"
        gcloud compute ssh ${_VM_NAME} --zone=${_ZONE} --tunnel-through-iap \
          --command="sudo /usr/local/bin/chiefvoice-deploy '$${image}' '$${function_url}'" \
          --quiet

  - id: smoke-test-public-endpoint
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        for endpoint in healthz readyz metrics; do
          curl --fail --silent --show-error --connect-timeout 5 --max-time 30 \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "https://${_PUBLIC_DOMAIN}/$${endpoint}" > /dev/null
        done

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}
