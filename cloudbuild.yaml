substitutions:
  _REGION: asia-south1
  _AR_REPOSITORY: chiefvoice
  _IMAGE_NAME: api
  _VM_NAME: chiefvoice-backend
  _ZONE: asia-south1-a
  _PUBLIC_DOMAIN: core.elvoryx.in
  _FUNCTION_NAME: chiefvoice-post-call
  _FUNCTION_REGION: asia-south1
  _FUNCTION_NETWORK: REPLACE_WITH_TERRAFORM_OUTPUT
  _FUNCTION_SUBNET: REPLACE_WITH_TERRAFORM_OUTPUT
  _FUNCTION_SERVICE_ACCOUNT: REPLACE_WITH_TERRAFORM_OUTPUT
  _FUNCTION_BUILD_SERVICE_ACCOUNT: REPLACE_WITH_TERRAFORM_OUTPUT
  _TASK_INVOKER_SERVICE_ACCOUNT: REPLACE_WITH_TERRAFORM_OUTPUT
  _POST_CALL_FUNCTION_MAX_INSTANCES: "10"
  _DATABASE_URL_SECRET: REPLACE_WITH_TERRAFORM_OUTPUT
  _CREDENTIALS_ENCRYPTION_KEY_SECRET: REPLACE_WITH_TERRAFORM_OUTPUT
  _POST_CALL_ENCRYPTION_KEY_SECRET: REPLACE_WITH_TERRAFORM_OUTPUT
  _RECORDINGS_ENCRYPTION_KEY_SECRET: REPLACE_WITH_TERRAFORM_OUTPUT
  _OBJECT_STORAGE_BUCKET: REPLACE_WITH_TERRAFORM_OUTPUT
  _VERTEX_LOCATION: us-central1
  _POST_CALL_LOCATION: global
  _POST_CALL_MODEL: gemini-3.5-flash-lite
  _POST_CALL_TRANSCRIPTION_LOCATION: asia-southeast1
  _POST_CALL_TRANSCRIPTION_MODEL: chirp_2
  _OIDC_AUDIENCE: https://core.elvoryx.in/api
  _OIDC_AUTHORITY: REPLACE_WITH_TERRAFORM_OUTPUT
  _OIDC_CLIENT_ID: REPLACE_WITH_TERRAFORM_OUTPUT
  _OIDC_SCOPE: openid profile email platform:customers:read platform:customers:write
  _OIDC_ISSUER: REPLACE_WITH_TERRAFORM_OUTPUT
  _OIDC_JWKS_URL: REPLACE_WITH_TERRAFORM_OUTPUT
  _OIDC_TENANT_CLAIM: https://core.elvoryx.in/tenant_id
  _PLATFORM_ADMIN_SUBJECTS: REPLACE_WITH_TERRAFORM_OUTPUT

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 3600s

steps:
  - id: verify-production-configuration
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        test "${PROJECT_ID}" = "chiefvoice-service" || { echo "Refusing deployment to unexpected GCP project" >&2; exit 1; }
        test "${_REGION}" = "asia-south1" || { echo "Refusing deployment with unexpected region" >&2; exit 1; }
        test "${_FUNCTION_REGION}" = "asia-south1" || { echo "Refusing deployment with unexpected function region" >&2; exit 1; }
        test "${_PUBLIC_DOMAIN}" = "core.elvoryx.in" || { echo "Refusing deployment with unexpected public domain" >&2; exit 1; }
        for value in \
          "${_AR_REPOSITORY}" "${_VM_NAME}" "${_ZONE}" \
          "${_FUNCTION_NAME}" "${_FUNCTION_REGION}" "${_FUNCTION_NETWORK}" "${_FUNCTION_SUBNET}" \
          "${_FUNCTION_SERVICE_ACCOUNT}" "${_FUNCTION_BUILD_SERVICE_ACCOUNT}" \
          "${_TASK_INVOKER_SERVICE_ACCOUNT}" "${_DATABASE_URL_SECRET}" \
          "${_CREDENTIALS_ENCRYPTION_KEY_SECRET}" "${_POST_CALL_ENCRYPTION_KEY_SECRET}" \
          "${_RECORDINGS_ENCRYPTION_KEY_SECRET}" "${_OBJECT_STORAGE_BUCKET}" \
          "${_VERTEX_LOCATION}" "${_POST_CALL_LOCATION}" "${_POST_CALL_MODEL}" \
          "${_POST_CALL_TRANSCRIPTION_LOCATION}" "${_POST_CALL_TRANSCRIPTION_MODEL}" \
          "${_OIDC_AUDIENCE}" "${_OIDC_AUTHORITY}" "${_OIDC_CLIENT_ID}" \
          "${_OIDC_SCOPE}" "${_OIDC_ISSUER}" "${_OIDC_JWKS_URL}" "${_OIDC_TENANT_CLAIM}" \
          "${_PLATFORM_ADMIN_SUBJECTS}"; do
          if [[ -z "$${value}" || "$${value}" == "REPLACE_WITH_TERRAFORM_OUTPUT" ]]; then
            echo "Refusing deployment with missing Terraform-managed configuration" >&2
            exit 1
          fi
        done
        for account in "${_FUNCTION_SERVICE_ACCOUNT}" "${_FUNCTION_BUILD_SERVICE_ACCOUNT}" "${_TASK_INVOKER_SERVICE_ACCOUNT}"; do
          [[ "$${account}" == *@${PROJECT_ID}.iam.gserviceaccount.com ]] || {
            echo "Refusing deployment with a service account outside the target project" >&2
            exit 1
          }
        done

  - id: verify-source
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        python -m pip install --no-cache-dir '.[dev]'
        pytest -q
        ruff check src tests --select F
        python -m compileall -q src

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${BUILD_ID}
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${BUILD_ID}

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - frontend/Dockerfile.production
      - --build-arg
      - VITE_OIDC_AUTHORITY=${_OIDC_AUTHORITY}
      - --build-arg
      - VITE_OIDC_CLIENT_ID=${_OIDC_CLIENT_ID}
      - --build-arg
      - VITE_OIDC_AUDIENCE=${_OIDC_AUDIENCE}
      - --build-arg
      - VITE_OIDC_SCOPE=${_OIDC_SCOPE}
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/console:${BUILD_ID}
      - frontend

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/console:${BUILD_ID}

  - id: deploy-post-call-function
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:558.0.0-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        bash deploy/gcp/post-call-function/prepare_source.sh /workspace/.post-call-function-source
        gcloud functions deploy ${_FUNCTION_NAME} \
          --gen2 --runtime=python312 --region=${_FUNCTION_REGION} \
          --source=/workspace/.post-call-function-source --entry-point=handler \
          --trigger-http --no-allow-unauthenticated \
          --service-account=${_FUNCTION_SERVICE_ACCOUNT} \
          --build-service-account=${_FUNCTION_BUILD_SERVICE_ACCOUNT} \
          --network=${_FUNCTION_NETWORK} \
          --subnet=${_FUNCTION_SUBNET} \
          --direct-vpc-egress=private-ranges-only \
          --timeout=240s --memory=1Gi \
          --max-instances=${_POST_CALL_FUNCTION_MAX_INSTANCES} \
          --set-env-vars=POST_CALL_AGENT_PROVIDER=langchain_vertex,VERTEX_PROJECT_ISOLATION_ENABLED=false,VERTEX_PROJECT_ID=${PROJECT_ID},VERTEX_LOCATION=${_VERTEX_LOCATION},POST_CALL_LOCATION=${_POST_CALL_LOCATION},POST_CALL_MODEL=${_POST_CALL_MODEL},POST_CALL_TRANSCRIPTION_PROJECT_ID=${PROJECT_ID},POST_CALL_TRANSCRIPTION_LOCATION=${_POST_CALL_TRANSCRIPTION_LOCATION},POST_CALL_TRANSCRIPTION_MODEL=${_POST_CALL_TRANSCRIPTION_MODEL},RECORDINGS_ENABLED=true,RECORDINGS_STORAGE_BACKEND=gcs,OBJECT_STORAGE_PROVIDER=gcs,OBJECT_STORAGE_BUCKET=${_OBJECT_STORAGE_BUCKET},OBJECT_STORAGE_PREFIX=chiefvoice \
          --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest,CREDENTIALS_ENCRYPTION_KEY=${_CREDENTIALS_ENCRYPTION_KEY_SECRET}:latest,POST_CALL_ENCRYPTION_KEY=${_POST_CALL_ENCRYPTION_KEY_SECRET}:latest,RECORDINGS_ENCRYPTION_KEY=${_RECORDINGS_ENCRYPTION_KEY_SECRET}:latest \
          --quiet
        gcloud run services add-iam-policy-binding ${_FUNCTION_NAME} \
          --region=${_FUNCTION_REGION} \
          --member=serviceAccount:${_TASK_INVOKER_SERVICE_ACCOUNT} \
          --role=roles/run.invoker --quiet
        gcloud functions describe ${_FUNCTION_NAME} --gen2 --region=${_FUNCTION_REGION} \
          --format='value(serviceConfig.uri)' > /workspace/post-call-function-url

  - id: deploy-vm-and-migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${BUILD_ID}"
        frontend_image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/console:${BUILD_ID}"
        function_url="$(cat /workspace/post-call-function-url)"
        test -n "$${function_url}"
        gcloud compute ssh ${_VM_NAME} --zone=${_ZONE} --tunnel-through-iap \
          --command="sudo sed -i -e 's#^OIDC_ISSUER=.*#OIDC_ISSUER=${_OIDC_ISSUER}#' -e 's#^OIDC_AUDIENCE=.*#OIDC_AUDIENCE=${_OIDC_AUDIENCE}#' -e 's#^OIDC_JWKS_URL=.*#OIDC_JWKS_URL=${_OIDC_JWKS_URL}#' -e 's#^OIDC_TENANT_CLAIM=.*#OIDC_TENANT_CLAIM=${_OIDC_TENANT_CLAIM}#' -e 's#^PLATFORM_ADMIN_SUBJECTS=.*#PLATFORM_ADMIN_SUBJECTS=${_PLATFORM_ADMIN_SUBJECTS}#' -e 's#^RECORDINGS_ENABLED=.*#RECORDINGS_ENABLED=true#' -e 's#^OBJECT_STORAGE_PROVIDER=.*#OBJECT_STORAGE_PROVIDER=gcs#' -e 's#^RECORDINGS_STORAGE_BACKEND=.*#RECORDINGS_STORAGE_BACKEND=gcs#' -e 's#^BACKUP_STORAGE_BACKEND=.*#BACKUP_STORAGE_BACKEND=gcs#' -e '/^OBJECT_STORAGE_ACCESS_KEY_ID=/d' -e '/^OBJECT_STORAGE_SECRET_ACCESS_KEY=/d' -e '/^OBJECT_STORAGE_SESSION_TOKEN=/d' -e '/^OBJECT_STORAGE_ENDPOINT_URL=/d' -e '/^OBJECT_STORAGE_REGION=/d' -e '/^OBJECT_STORAGE_ADDRESSING_STYLE=/d' /opt/chiefvoice/api.env && if ! sudo grep -q '^OBJECT_STORAGE_PROVIDER=' /opt/chiefvoice/api.env; then echo 'OBJECT_STORAGE_PROVIDER=gcs' | sudo tee -a /opt/chiefvoice/api.env >/dev/null; fi && sudo /usr/local/bin/chiefvoice-deploy '$${image}' '$${frontend_image}' '$${function_url}'" \
          --quiet

  - id: smoke-test-public-endpoint
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        for endpoint in healthz readyz metrics; do
          curl --fail --silent --show-error --connect-timeout 5 --max-time 30 \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "https://${_PUBLIC_DOMAIN}/$${endpoint}" > /dev/null
        done

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/console:${BUILD_ID}
