substitutions:
  _REGION: us-central1
  _AR_REPOSITORY: chiefvoice
  _SERVICE_NAME: chiefvoice-api
  _MIGRATION_JOB_NAME: chiefvoice-migrate
  _RUNTIME_SERVICE_ACCOUNT: CHANGE_ME
  _MIGRATION_SERVICE_ACCOUNT: CHANGE_ME
  _CLOUD_SQL_INSTANCE: CHANGE_ME
  _DATABASE_URL_SECRET: chiefvoice-database-url
  _CREDENTIALS_ENCRYPTION_KEY_SECRET: chiefvoice-credentials-encryption-key
  _POST_CALL_ENCRYPTION_KEY_SECRET: chiefvoice-post-call-encryption-key
  _VOBIZ_WEBHOOK_SECRET: chiefvoice-vobiz-webhook-secret
  _VOBIZ_ROUTE_TOKEN_SECRET: chiefvoice-vobiz-route-token
  _GCP_PROJECT_PARENT: CHANGE_ME
  _GCP_BILLING_ACCOUNT_ID: CHANGE_ME
  _GCP_BUDGET_API_PROJECT_ID: CHANGE_ME
  _GCP_VERTEX_MONTHLY_SPEND_CAP: "100"
  _VERTEX_LOCATION: us-central1
  _OIDC_ISSUER: CHANGE_ME
  _OIDC_AUDIENCE: CHANGE_ME
  _OIDC_JWKS_URL: CHANGE_ME
  _MIN_INSTANCES: "1"
  _MAX_INSTANCES: "20"
  _CPU: "2"
  _MEMORY: 2Gi
  _CONCURRENCY: "10"
  _TIMEOUT: 3600s

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build-container
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
      - .

  - id: push-container
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}

  - id: deploy-and-run-migrations
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_MIGRATION_JOB_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
      - --region=${_REGION}
      - --service-account=${_MIGRATION_SERVICE_ACCOUNT}
      - --set-cloudsql-instances=${_CLOUD_SQL_INSTANCE}
      - --command=alembic
      - --args=upgrade,head
      - --tasks=1
      - --max-retries=1
      - --task-timeout=900s
      - --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest
      - --quiet

  - id: run-migrations
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - ${_MIGRATION_JOB_NAME}
      - --region=${_REGION}
      - --wait
      - --quiet

  - id: deploy-cloud-run-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --set-cloudsql-instances=${_CLOUD_SQL_INSTANCE}
      - --allow-unauthenticated
      - --port=8080
      - --cpu=${_CPU}
      - --memory=${_MEMORY}
      - --concurrency=${_CONCURRENCY}
      - --timeout=${_TIMEOUT}
      - --min=${_MIN_INSTANCES}
      - --max=${_MAX_INSTANCES}
      - --no-cpu-throttling
      - --set-env-vars=APP_ENV=production,LOG_LEVEL=INFO,REALTIME_AGENT_PROVIDER=vertex,VERTEX_PROJECT_ISOLATION_ENABLED=true,VERTEX_LOCATION=${_VERTEX_LOCATION},POST_CALL_AGENT_PROVIDER=langchain_vertex,POST_CALL_EXECUTION_BACKEND=in_process,GCP_PROJECT_PARENT=${_GCP_PROJECT_PARENT},GCP_BILLING_ACCOUNT_ID=${_GCP_BILLING_ACCOUNT_ID},GCP_RUNTIME_SERVICE_ACCOUNT=${_RUNTIME_SERVICE_ACCOUNT},GCP_BUDGET_API_PROJECT_ID=${_GCP_BUDGET_API_PROJECT_ID},GCP_VERTEX_MONTHLY_SPEND_CAP=${_GCP_VERTEX_MONTHLY_SPEND_CAP},OIDC_ISSUER=${_OIDC_ISSUER},OIDC_AUDIENCE=${_OIDC_AUDIENCE},OIDC_JWKS_URL=${_OIDC_JWKS_URL},OTEL_SERVICE_NAME=chiefvoice-api
      - --set-secrets=CREDENTIALS_ENCRYPTION_KEY=${_CREDENTIALS_ENCRYPTION_KEY_SECRET}:latest,POST_CALL_ENCRYPTION_KEY=${_POST_CALL_ENCRYPTION_KEY_SECRET}:latest,VOBIZ_WEBHOOK_SECRET=${_VOBIZ_WEBHOOK_SECRET}:latest,VOBIZ_INBOUND_ROUTE_TOKEN=${_VOBIZ_ROUTE_TOKEN_SECRET}:latest
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
