substitutions:
  _REGION: us-central1
  _AR_REPOSITORY: chiefvoice
  _IMAGE_NAME: api
  _VM_NAME: chiefvoice-backend
  _ZONE: us-central1-a
  _PUBLIC_DOMAIN: chiefvoice.elvoryx.in
  _FUNCTION_NAME: chiefvoice-post-call
  _FUNCTION_VPC_CONNECTOR: chiefvoice-functions
  _FUNCTION_SERVICE_ACCOUNT: chiefvoice-post-call@chief-502717.iam.gserviceaccount.com
  _TASK_INVOKER_SERVICE_ACCOUNT: chiefvoice-task-invoker@chief-502717.iam.gserviceaccount.com
  _POST_CALL_FUNCTION_MAX_INSTANCES: "10"
  _DATABASE_URL_SECRET: chiefvoice-function-database-url
  _POST_CALL_ENCRYPTION_KEY_SECRET: chiefvoice-post-call-encryption-key
  _VERTEX_LOCATION: us-central1
  _POST_CALL_MODEL: gemini-2.5-flash
  _OIDC_AUDIENCE: https://chiefvoice.elvoryx.in/api
  _OIDC_AUTHORITY: https://dev-ls5gkmim0q0ioeu1.us.auth0.com/
  _OIDC_CLIENT_ID: JjVV1d1Rn69oazE7h7s5JOuwbvAA6q4K
  _OIDC_SCOPE: openid profile email platform:customers:read platform:customers:write
  _OIDC_ISSUER: https://dev-ls5gkmim0q0ioeu1.us.auth0.com/
  _OIDC_JWKS_URL: https://dev-ls5gkmim0q0ioeu1.us.auth0.com/.well-known/jwks.json
  _OIDC_TENANT_CLAIM: https://chiefvoice.elvoryx.in/tenant_id
  _PLATFORM_ADMIN_SUBJECTS: auth0|6af9a7262178bf91525670d9

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 3600s

steps:
  - id: verify-source
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        python -m pip install --no-cache-dir '.[dev]'
        pytest -q
        ruff check src tests --select F
        python -m compileall -q src

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - frontend/Dockerfile.production
      - --build-arg
      - VITE_OIDC_AUTHORITY=${_OIDC_AUTHORITY}
      - --build-arg
      - VITE_OIDC_CLIENT_ID=${_OIDC_CLIENT_ID}
      - --build-arg
      - VITE_OIDC_AUDIENCE=${_OIDC_AUDIENCE}
      - --build-arg
      - VITE_OIDC_SCOPE=${_OIDC_SCOPE}
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/console:${SHORT_SHA}
      - frontend

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/console:${SHORT_SHA}

  - id: deploy-post-call-function
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        bash deploy/gcp/post-call-function/prepare_source.sh /workspace/.post-call-function-source
        gcloud functions deploy ${_FUNCTION_NAME} \
          --gen2 --runtime=python312 --region=${_REGION} \
          --source=/workspace/.post-call-function-source --entry-point=handler \
          --trigger-http --no-allow-unauthenticated \
          --service-account=${_FUNCTION_SERVICE_ACCOUNT} \
          --vpc-connector=${_FUNCTION_VPC_CONNECTOR} \
          --egress-settings=private-ranges-only \
          --timeout=240s --memory=1Gi \
          --max-instances=${_POST_CALL_FUNCTION_MAX_INSTANCES} \
          --set-env-vars=POST_CALL_AGENT_PROVIDER=langchain_vertex,VERTEX_PROJECT_ISOLATION_ENABLED=false,VERTEX_PROJECT_ID=${PROJECT_ID},VERTEX_LOCATION=${_VERTEX_LOCATION},POST_CALL_MODEL=${_POST_CALL_MODEL} \
          --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest,POST_CALL_ENCRYPTION_KEY=${_POST_CALL_ENCRYPTION_KEY_SECRET}:latest \
          --quiet
        gcloud run services add-iam-policy-binding ${_FUNCTION_NAME} \
          --region=${_REGION} \
          --member=serviceAccount:${_TASK_INVOKER_SERVICE_ACCOUNT} \
          --role=roles/run.invoker --quiet
        gcloud functions describe ${_FUNCTION_NAME} --gen2 --region=${_REGION} \
          --format='value(serviceConfig.uri)' > /workspace/post-call-function-url

  - id: deploy-vm-and-migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}"
        frontend_image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/console:${SHORT_SHA}"
        function_url="$(cat /workspace/post-call-function-url)"
        test -n "$${function_url}"
        gcloud compute ssh ${_VM_NAME} --zone=${_ZONE} --tunnel-through-iap \
          --command="sudo sed -i -e 's#^OIDC_ISSUER=.*#OIDC_ISSUER=${_OIDC_ISSUER}#' -e 's#^OIDC_AUDIENCE=.*#OIDC_AUDIENCE=${_OIDC_AUDIENCE}#' -e 's#^OIDC_JWKS_URL=.*#OIDC_JWKS_URL=${_OIDC_JWKS_URL}#' -e 's#^OIDC_TENANT_CLAIM=.*#OIDC_TENANT_CLAIM=${_OIDC_TENANT_CLAIM}#' -e 's#^PLATFORM_ADMIN_SUBJECTS=.*#PLATFORM_ADMIN_SUBJECTS=${_PLATFORM_ADMIN_SUBJECTS}#' /opt/chiefvoice/api.env && sudo /usr/local/bin/chiefvoice-deploy '$${image}' '$${frontend_image}' '$${function_url}'" \
          --quiet

  - id: smoke-test-public-endpoint
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        for endpoint in healthz readyz metrics; do
          curl --fail --silent --show-error --connect-timeout 5 --max-time 30 \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "https://${_PUBLIC_DOMAIN}/$${endpoint}" > /dev/null
        done

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/console:${SHORT_SHA}
